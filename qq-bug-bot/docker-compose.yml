name: grandumi-qq-bug-bot

services:
  napcat:
    image: mlikiowa/napcat-docker:latest
    container_name: grandumi-napcat
    restart: unless-stopped
    environment:
      NAPCAT_UID: "${NAPCAT_UID:-1000}"
      NAPCAT_GID: "${NAPCAT_GID:-1000}"
      TZ: "${TZ:-Asia/Shanghai}"
    ports:
      - "127.0.0.1:6099:6099"
    expose:
      - "3001"
    volumes:
      - napcat_qq:/app/.config/QQ
      - napcat_config:/app/napcat/config
      - napcat_plugins:/app/napcat/plugins

  bug-bot:
    build:
      context: .
    container_name: grandumi-qq-bug-bot
    restart: unless-stopped
    depends_on:
      - napcat
    environment:
      TZ: "${TZ:-Asia/Shanghai}"
      GH_TOKEN: "${GH_TOKEN:-}"
      BUG_BOT_CONFIG_PATH: /run/secrets/bot_config
      BUG_BOT_DB_PATH: /data/feedback.db
      BUG_BOT_REPORTS_DIR: /data/reports
      GRANDUMI_QQ_WHITELIST_SYNC_SECRET: "${GRANDUMI_QQ_WHITELIST_SYNC_SECRET:-}"
    secrets:
      - bot_config
    volumes:
      - ./data:/data

secrets:
  bot_config:
    file: ./config.server.json

volumes:
  napcat_qq:
  napcat_config:
  napcat_plugins:
